[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filegate"
version = "0.1.0"
description = "Decide, per file, whether an expensive LLM security scan is worth it: skip, route to a cheaper model, or scan in full. Self-hosted, offline, explainable."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "magika>=1.0",
]

[project.optional-dependencies]
nano = ["opendecider>=0.6"]
head = ["sentence-transformers>=3", "scikit-learn>=1.4", "joblib>=1.3", "numpy>=1.26"]
dev = ["pytest>=8"]

[project.scripts]
filegate = "filegate.cli:main"

[tool.setuptools.packages.find]
include = ["filegate*"]

[tool.setuptools.package-data]
filegate = ["default.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
